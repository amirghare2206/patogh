name: Build V13 Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest

   env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Prepare V13 source
        run: |
          python3 tool/prepare_public_release.py
          python3 tool/configure_android_release.py
          python3 tool/configure_public_platforms.py
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build V13 staging APK
        run: |
          flutter build apk --release \
  --dart-define=PATOGH_MODE=staging \
  --dart-define=SUPABASE_URL="$STAGING_SUPABASE_URL" \
  --dart-define=SUPABASE_ANON_KEY="$STAGING_SUPABASE_ANON_KEY" \
  --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
  --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
  --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
  --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
  --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
  --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: patogh-v13-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
