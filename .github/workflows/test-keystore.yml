name: Test Secret Decode

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Decode
        shell: bash
        run: |
          echo "SECRET LENGTH"
          echo -n "$TEST_SECRET" | wc -c

          printf '%s' "$TEST_SECRET" > secret.txt

          echo "SECRET FILE SIZE"
          wc -c secret.txt

          base64 -d secret.txt > test-release.jks

          echo "KEYSTORE SIZE"
          wc -c test-release.jks