name: Test Secret Output

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Write result to summary
        shell: bash
        run: |
          LEN=$(echo -n "$TEST_SECRET" | wc -c)

          echo "## Secret Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Secret length: $LEN" >> $GITHUB_STEP_SUMMARY