name: Build V14 Staging APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install Android API 36
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare pubspec
        run: python3 tool/prepare_pubspec_release.py

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android
        run: python3 tool/configure_android_release.py

      - name: Restore Android release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" | base64 --decode \
            > android/app/patogh-release.jks

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=patogh-release.jks
          EOF

          keytool -list \
            -keystore android/app/patogh-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Release signing restored successfully."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Staging secrets exist
        shell: bash
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          test -n "$STAGING_KEY"

          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          host = urlsplit(os.environ["STAGING_URL"]).hostname
          expected = "sxglkafhprigkeqdtanr.supabase.co"

          print("Staging host:", host)

          if host != expected:
              raise SystemExit(
                  f"Wrong STAGING_SUPABASE_URL host: {host!r}"
              )
          PY

      - name: Build V14 Staging APK
        shell: bash
        env:
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          BUILD_NUMBER=$((140000 + GITHUB_RUN_NUMBER))

          echo "V14 staging build number: $BUILD_NUMBER"

          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PATOGH_MODE=staging \
            --dart-define=SUPABASE_URL="$STAGING_URL" \
            --dart-define=SUPABASE_ANON_KEY="$STAGING_KEY"

      - name: APK information
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload V14 Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: patogh-v14-staging-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
