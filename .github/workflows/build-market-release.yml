name: Build Bazaar Market Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android API 36
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python3 tool/prepare_pubspec_release.py
      - run: flutter pub get
      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/patogh-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=patogh-release.jks
          EOF
      - run: python3 tool/configure_android_release.py
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APK and AAB
        run: |
          COMMON_DEFINES=(
            --dart-define=PATOGH_MODE=production
            --dart-define=SUPABASE_URL="${{ secrets.PROD_SUPABASE_URL }}"
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.PROD_SUPABASE_ANON_KEY }}"
            --dart-define=PAYMENT_API_BASE_URL="${{ secrets.PAYMENT_API_BASE_URL }}"
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}"
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          )
          flutter build apk --release "${COMMON_DEFINES[@]}"
          flutter build appbundle --release "${COMMON_DEFINES[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: patogh-v12-bazaar-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
